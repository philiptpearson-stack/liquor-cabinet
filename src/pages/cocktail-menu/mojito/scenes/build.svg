<svg viewBox="0 0 240 204" role="img" aria-label="How to make a Mojito, step by step: Mint, lime and sugar. Add the mint leaves, lime juice and simple syrup to a tall glass. Muddle, gently. Press the mint a few times, just enough to wake it up. Don't shred it. Rum and ice. Pour in the rum, then fill the glass with ice (crushed, if you have it). Top with soda. A splash of soda water, then a quick stir, bottom to top. Garnish. A sprig of mint and a lime wheel. Cheers!"><g transform="translate(-104 -14)"><g filter="url(#wash)"><rect x="0" y="0" width="400" height="236" fill="#f3e6d4"/></g><rect x="0" y="196" width="400" height="40" fill="#6e4b39"/><g filter="url(#wash)"><rect x="0" y="196" width="400" height="9" fill="#9a6b4c"/><rect x="0" y="205" width="400" height="31" fill="#6b4634"/></g><g filter="url(#crayon)" fill="none" stroke="#5b2c4c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 196 H400 M0 205 H400"/><path d="M64 205 V236" stroke-width="1.6"/><path d="M168 205 V236" stroke-width="1.6"/><path d="M262 205 V236" stroke-width="1.6"/><path d="M352 205 V236" stroke-width="1.6"/><path d="M22 199.5 h38" stroke="#7d5640" stroke-width="1.2"/><path d="M120 199.5 h54" stroke="#7d5640" stroke-width="1.2"/><path d="M230 199.5 h30" stroke="#7d5640" stroke-width="1.2"/><path d="M300 199.5 h46" stroke="#7d5640" stroke-width="1.2"/></g><rect x="172" y="192" width="104" height="8" rx="3" fill="#33403b"/><path d="M177 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M183 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M189 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M195 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M201 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M207 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M213 193.6 v4.6" stroke="#5