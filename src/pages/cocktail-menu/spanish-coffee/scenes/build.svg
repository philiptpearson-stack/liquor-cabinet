<svg viewBox="0 0 240 204" role="img" aria-label="How to make a Spanish Coffee, step by step: Sugar the rim. Rub a lime wedge around the rim of an Irish coffee glass, then dip it in sugar. Rum and triple sec, then fire. Add the overproof rum and triple sec, and carefully light it. Turn the glass slowly, so the flame caramelizes the sugar on the rim. Coffee liqueur and coffee. Pour in the coffee liqueur (it puts out the flame), then the hot coffee. Cream and nutmeg. Float the lightly whipped cream over the back of a spoon, and grate a little nutmeg on top. Cheers!"><g transform="translate(-104 -14)"><g filter="url(#wash)"><rect x="0" y="0" width="400" height="236" fill="#f3e6d4"/></g><rect x="0" y="196" width="400" height="40" fill="#6e4b39"/><g filter="url(#wash)"><rect x="0" y="196" width="400" height="9" fill="#9a6b4c"/><rect x="0" y="205" width="400" height="31" fill="#6b4634"/></g><g filter="url(#crayon)" fill="none" stroke="#5b2c4c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 196 H400 M0 205 H400"/><path d="M64 205 V236" stroke-width="1.6"/><path d="M168 205 V236" stroke-width="1.6"/><path d="M262 205 V236" stroke-width="1.6"/><path d="M352 205 V236" stroke-width="1.6"/><path d="M22 199.5 h38" stroke="#7d5640" stroke-width="1.2"/><path d="M120 199.5 h54" stroke="#7d5640" stroke-width="1.2"/><path d="M230 199.5 h30" stroke="#7d5640" stroke-width="1.2"/><path d="M300 199.5 h46" stroke="#7d5640" stroke-width="1.2"/></g><rect x="172" y="192" width="104" height="8" rx="3" fill="#33403b"/><path d="M177 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M183 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M189 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M195 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M201 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M207 193.6 v4.