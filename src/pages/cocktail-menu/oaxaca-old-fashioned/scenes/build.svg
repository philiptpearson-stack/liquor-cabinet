<svg viewBox="0 0 240 204" role="img" aria-label="How to make an Oaxaca Old Fashioned, step by step: Combine ingredients. Add the tequila, mezcal, agave syrup and bitters to a mixing glass. Stir. Fill with ice and stir until the drink is good and cold. Then, stir longer! (Seriously. You need some of that ice to melt. Water softens the alcohol-bite and brings the drink into balance. Dilution is part of the recipe.) Strain over a big cube. Strain into a rocks glass over one large ice cube. Garnish. Squeeze an orange peel over the top. (Hold a lit match under it as you squeeze, if you want a little show.) Cheers!"><g transform="translate(-104 -14)"><g filter="url(#wash)"><rect x="0" y="0" width="400" height="236" fill="#f3e6d4"/></g><rect x="0" y="196" width="400" height="40" fill="#6e4b39"/><g filter="url(#wash)"><rect x="0" y="196" width="400" height="9" fill="#9a6b4c"/><rect x="0" y="205" width="400" height="31" fill="#6b4634"/></g><g filter="url(#crayon)" fill="none" stroke="#5b2c4c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 196 H400 M0 205 H400"/><path d="M64 205 V236" stroke-width="1.6"/><path d="M168 205 V236" stroke-width="1.6"/><path d="M262 205 V236" stroke-width="1.6"/><path d="M352 205 V236" stroke-width="1.6"/><path d="M22 199.5 h38" stroke="#7d5640" stroke-width="1.2"/><path d="M120 199.5 h54" stroke="#7d5640" stroke-width="1.2"/><path d="M230 199.5 h30" stroke="#7d5640" stroke-width="1.2"/><path d="M300 199.5 h46" stroke="#7d5640" stroke-width="1.2"/></g><rect x="146" y="192" width="188" height="8" rx="3" fill="#33403b"/><path d="M151 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M157 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M163 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M169 193.6 v4.6" stroke="#55675f" stroke-width="1.6" stroke-linecap="round"/><path d="M175 193.6 v4.6" stroke="#55675f" stroke-width="1.6"