<svg viewBox="0 0 320 222" role="img" aria-label="A balance scale. A bottle of spirit tips it down on one side. Simple syrup on the other side tips it too far the other way. A lemon added next to the spirit brings it level: balance. Then the lemon comes off, a bottle of bitters goes on, and it balances again"><g transform="translate(-40 -6)"><g filter="url(#wash)"><rect x="0" y="0" width="400" height="236" fill="#f3e6d4"/></g><g filter="url(#crayon)" fill="none" stroke="#5b2c4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M200 70 V200 M170 202 H230" stroke-width="3.4"/></g><g filter="url(#wash)"><path d="M192 82 L200 68 L208 82Z" fill="#e6b264"/></g><g class="beam" style="transform-origin:200px 70px"><g filter="url(#wash)"><rect x="86" y="67" width="228" height="6" rx="3" fill="#9b7663"/></g><g filter="url(#crayon)" fill="none" stroke="#5b2c4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="86" y="67" width="228" height="6" rx="3" stroke-width="2"/></g><g filter="url(#wash)"><circle cx="200" cy="70" r="5" fill="#e6b264"/></g><g filter="url(#crayon)" fill="none" stroke="#5b2c4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="200" cy="70" r="5" stroke-width="2"/></g><g class="pan" style="transform-origin:90px 70px"><g filter="url(#crayon)" fill="none" stroke="#5b2c4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M90 70 L66 134 M90 70 L114 134" stroke-width="1.6"/></g><g filter="url(#wash)"><path d="M60 134 Q90 152 120 134Z" fill="#e6b264"/></g><g filter="url(#crayon)" fill="none" stroke="#5b2c4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M60 134 Q90 152 120 134Z" stroke-width="2"/></g><g class="sc-spirit"><g transform="translate(80 136) scale(0.8)"><g filter="url(#wash)"><path d="M-13 0 L-13 -38 Q-13 -46 -6 -50 L-5 -62 L5 -62 L6 -50 Q13 -46 13 -38 L13 0Z" fill="#c98a3c"/><rect x="-10" y="-30" width="20" height="16" rx